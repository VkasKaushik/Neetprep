<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- Target & Caduceus / Cross Motif -->
  <!-- Outer target ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1e293b" stroke-width="8" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="95" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Center Stethoscope / Cross / Focus symbol -->
  <path d="M256 160 V352" stroke="#f8fafc" stroke-width="20" stroke-linecap="round"/>
  <path d="M160 256 H352" stroke="#f8fafc" stroke-width="20" stroke-linecap="round"/>

  <!-- Accent dots for Physics, Chemistry, Biology -->
  <circle cx="256" cy="116" r="16" fill="#3b82f6"/> <!-- Physics (Blue) -->
  <circle cx="396" cy="256" r="16" fill="#a855f7"/> <!-- Chemistry (Purple) -->
  <circle cx="256" cy="396" r="16" fill="#10b981"/> <!-- Biology (Green) -->
  <circle cx="116" cy="256" r="16" fill="#06b6d4"/> <!-- Focus (Cyan) -->

  <!-- Inner core -->
  <circle cx="256" cy="256" r="28" fill="#07090e" stroke="#06b6d4" stroke-width="6"/>
  <circle cx="256" cy="256" r="12" fill="#06b6d4"/>
</svg>
